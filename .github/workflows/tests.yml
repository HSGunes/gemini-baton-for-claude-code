name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q

  package:
    name: Package and launchers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install registers both commands
        run: |
          pip install .
          baton --help > /dev/null
          ajan --help > /dev/null
      - name: Plugin launcher works through a symlink
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sfn "$PWD/bin/baton" "$HOME/.local/bin/baton-link"
          "$HOME/.local/bin/baton-link" --help > /dev/null
      - name: Plugin manifests are valid JSON and versions match
        run: |
          python - <<'EOF'
          import json, tomllib
          plugin = json.load(open(".claude-plugin/plugin.json"))
          json.load(open(".claude-plugin/marketplace.json"))
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          assert plugin["version"] == project["version"], (plugin["version"], project["version"])
          print("plugin", plugin["name"], plugin["version"], "OK")
          EOF

  plugin:
    name: Claude Code plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/claude-code plugin validate --strict .
