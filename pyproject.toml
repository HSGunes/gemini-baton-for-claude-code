[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-baton"
version = "0.4.0"
description = "Lightweight Gemini (agy CLI) sub-agent orchestrator for Claude Code and automated workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
baton = "ajan:main"
ajan = "ajan:main"

[tool.setuptools]
py-modules = ["ajan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
